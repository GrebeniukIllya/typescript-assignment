<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Мій Блог – модульна версія</title>
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css" />
  <style>
    /* Custom styles specific to this blog template */
    .scrolled {
      background-color: #333;
      color: #fff;
    }
    .post-card img {
      width: 100%;
    }
    /* Modal styling */
    #modal {
      display: none;
      position: fixed;
      z-index: 999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.4);
    }
    .modal-content {
      background-color: #fefefe;
      margin: 10% auto;
      padding: 20px;
      border: 1px solid #888;
      width: 80%;
    }
    .close {
      color: #aaa;
      float: right;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- Header / Navbar -->
  <header id="header" class="w3-container w3-center w3-padding-32">
    <h1><b>МІЙ БЛОГ</b></h1>
    <p>Ласкаво просимо до мого блогу</p>
    <button id="openModalButton" class="w3-button w3-blue">Відкрити модальне вікно</button>
  </header>

  <!-- Blog posts section -->
  <div class="w3-row" id="postsContainer" style="max-width: 1200px; margin: auto;"></div>

  <!-- Modal Structure -->
  <div id="modal">
    <div class="modal-content">
      <span id="modalClose" class="close">&times;</span>
      <p>Це модальне вікно. Натисніть на хрестик або за межами вікна, щоб закрити його.</p>
    </div>
  </div>

  <!-- Footer -->
  <footer class="w3-container w3-center w3-light-grey w3-padding-32">
    <p>© 2025 Мій Блог. Всі права захищені.</p>
  </footer>

  <!-- Main compiled script -->
  <script src="dist/main.js"></script>
</body>
</html>
